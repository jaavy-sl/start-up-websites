<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel booking <form action=""></form></title>
    <link rel="stylesheet" href="hotel-booking.css"/>
</head>
<body>
    <main class="container">
        <div class="header">
            <section>
            <hi>
                Misty mountain lodge
            </hi>
            </section>
            <hr>
            <p>
                <i>where your happines and plessure is guranted</i>
            </p>
        </div>

        <div>
            <fieldset class="first-input">
                <legend>
                    personal Information
                </legend>
                <div class="personal">
                    <label for="first-name">First name: 
                                            <input type="text" id="first-name" name="name" required placeholder="eg. papius">

                    </label>
                    <label for="second-name">Second name: 
                        <input type="text" id="second-name" name="name" required placeholder="eg. karuri">
                    </label>
                    <label for="id-no">Id number: 
                        <input type="number" placeholder="eg. 23145" id="id-no" name="number">
                    </label>
                    <label>Contact:
                        <input type="number" id="contact" placeholder="eg. 0757140444" const packageName = require('packageName');>
                    </label>
                </div>
            </fieldset>

            <fieldset>
                <legend>
                    Place of Intrest
                </legend>
                <label for="swim">Swimming
                    <input type="radio" id="swim" name="name">

                </label>
                <label for="bicycle-riding">Bicycle riding
                    <input type="radio" id="bicycle-riding">
                </label>
                <label for="boat">Boat riding
                    <input type="radio" name="name" id="boat">
                </label>
                <label for="partying">Partying
                    <input type="radio" id="partying">
                </label>
                <label for="mountain">Mountain climbing
                    <input type="radio" id="mountain">
                </label>

                <label>Number of peaole:
                    <select>
                        <option>1-3</option>
                        <option>1-5</option>
                        <option>1-7</option>
                        <option>1-10</option>
                    </select>
                </label>
            </fieldset>
            <fieldset>
                <legend>
                    Duration
                    </legend>
                    <label>How much time do you wish to spend</label>
                    <select>
                        <option>1 day</option>
                        <option>2 days</option>
                        <option>3 days</option>
                        <option>4 days</option>
                        <option>5 days</option>
                        <option>1 week</option>

                    </select>
                </legend>
            </fieldset>
        </div>
        <div class="btn">
        <button>submit</button>
        </div>
        <footer>
             Kenya<br>
                Nairobi<br>
            <address class="address">
                📞 0757140444
               <a href="📧 mistylodge@gmail.com"></a> 📧 mistylodge@gmail.com

            </address>
        </footer>
    </main>
    
</body>
</html>
